[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banglish-emo"
version = "0.1.0"
description = "Controlled study of romanized vs native-script Bangla emotion recognition"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
